name: "Integration Tests (scheduler)"
run-name: "Dispatch integration tests → ${{ github.event_name == 'schedule' && 'auto' || 'manual' }}"

on:
    schedule:
        # Same schedule every day (weekday or weekend): two runs per day.
        # Each run takes at most ~2h30m, so the two slots are spaced 4h apart and
        # both fall in off-hours (PT). DST shifts these ~1h; exact times are not critical.
        - cron: "17 8 * * *" # ~00:17 AM PT nightly (08:17 UTC) → preview
        - cron: "17 12 * * *" # ~04:17 AM PT early morning (12:17 UTC) → dev
    workflow_dispatch:

permissions:
    contents: "read"
    actions: "write"

jobs:
    dispatch:
        name: "Dispatch to target branch"
        runs-on: ubuntu-latest
        if: github.repository == 'Azure/azure-iot-cli-extension'
        steps:
            - name: "Compute rotation and dispatch"
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail

                  # Determine target branch based on which scheduled slot triggered the run.
                  # Nightly slot (08:17 UTC) → preview; early-morning slot (12:17 UTC) → dev.
                  # Manual (workflow_dispatch) runs have no schedule and default to preview.
                  schedule="${{ github.event.schedule }}"
                  if [ "$schedule" = "17 12 * * *" ]; then
                    branch="dev"
                  else
                    branch="preview"
                  fi

                  # Rotate Python version and region using day-of-year as seed
                  py_versions=("3.10" "3.11" "3.12" "3.13")
                  region_list=("eastus" "westus" "northeurope" "westeurope")
                  day_of_year=$(date -u +"%j")
                  py_idx=$(( day_of_year % ${#py_versions[@]} ))
                  rg_idx=$(( (day_of_year / ${#py_versions[@]}) % ${#region_list[@]} ))
                  python_ver="${py_versions[$py_idx]}"
                  region="${region_list[$rg_idx]}"

                  echo "Dispatching to $branch: Python $python_ver, Region $region"
                  gh workflow run int_test.yml \
                    --repo "${{ github.repository }}" \
                    --ref "$branch" \
                    -f python-versions="$python_ver" \
                    -f regions="$region" || echo "::warning::Failed to dispatch to $branch (branch may not exist)"
